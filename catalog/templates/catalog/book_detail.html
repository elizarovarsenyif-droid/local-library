{% extends "base_generic.html" %}

{% block content %}

<h1>{{ book.title }}</h1>

<p><strong>Автор:</strong> {{ book.author }}</p>

<p><strong>Описание:</strong> {{ book.summary }}</p>

<p><strong>ISBN:</strong> {{ book.isbn }}</p>

<p><strong>Жанр:</strong> {{ book.genre.all|join:", " }}</p>

{% endblock %}
