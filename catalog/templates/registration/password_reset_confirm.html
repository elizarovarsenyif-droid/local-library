{% extends "base_generic.html" %}

{% block content %}

<h1>Установка нового пароля</h1>

{% if validlink %}
    <p>Введите новый пароль дважды.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Изменить пароль">
    </form>
{% else %}
    <p>Ссылка для восстановления пароля недействительна или устарела.</p>
{% endif %}

{% endblock %}
